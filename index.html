/* HUD compacto: sem retrato/nome e valores dentro das barras */
#hud{height:auto;min-height:0;width:31%;padding:1% 1.2%;display:flex;flex-direction:column;gap:6px;border-radius:16px}
#hud .stat{margin:0}
#hud .stathead{display:none}
#hud .bar{position:relative;height:clamp(20px,3.4vh,28px);border-radius:10px;overflow:hidden;background:#10233b;border:1px solid #34516b}
#hud .fill{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:8px}
#hud .bar-label{position:absolute;left:8px;top:0;bottom:0;display:flex;align-items:center;z-index:3;font-size:clamp(9px,1.2vw,13px);font-weight:900;color:#fff;text-shadow:0 1px 3px #000;line-height:1}
#hud .bar-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(10px,1.35vw,14px);font-weight:900;color:#fff;text-shadow:0 1px 3px #000;z-index:2;white-space:nowrap;line-height:1}
#hud .exp-stat .bar{background:#244321}
#hud .exp{background:linear-gradient(90deg,#65c95a,#b8f27a);width:0%}
#expPanel{display:none!important}
/* Menu do aventureiro: sete opções sempre visíveis, sem rolagem */
.window{width:94%;height:90%;max-height:90%;overflow:hidden;padding:1.8% 2.5%;display:flex;flex-direction:column;}
.window h2{flex:0 0 auto;margin:0 0 1.2%;padding:0 48px;font-size:clamp(13px,2.2vw,22px);line-height:1.15}
.menu-grid{flex:1 1 auto;min-height:0;grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(4px,1vh,10px) clamp(8px,1.4vw,18px);}
.menu-item{min-height:0;height:100%;padding:3px 8px;gap:clamp(6px,1vw,14px);border-radius:12px;}
.menu-item img{width:clamp(42px,7vw,72px);height:clamp(42px,7vw,72px);}
.menu-item .menu-label{font-size:clamp(11px,1.7vw,18px)}
.menu-item:last-child{width:54%;height:100%;min-height:0}
.close{right:1%;top:1%;min-height:32px;min-width:36px;padding:2px 10px;z-index:3}

/* VELKARYS v3.5 — acabamento visual: fantasia medieval, contraste e profundidade */
:root{
  --vk-ink:#06101d;--vk-panel:#0b1b2b;--vk-panel2:#10283a;
  --vk-cyan:#69d9ef;--vk-cyan-soft:#2f8198;--vk-gold:#f0cd7b;
  --vk-gold-deep:#9e7939;--vk-text:#f3f7fb;--vk-muted:#a8c1ce;
}
#game{isolation:isolate;background:radial-gradient(ellipse at 50% 45%,#183b55 0%,#0a1b2c 72%,#050b13 100%);box-shadow:0 0 0 1px #24495c,0 18px 55px #000b}
#game:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 0 2px #72d8ed18,inset 0 0 70px #02071255}
#hud{border:2px solid #61cde5;background:linear-gradient(145deg,#0b2034f5,#06111ff5);box-shadow:0 7px 20px #0009,inset 0 0 0 1px #d7f7ff20,0 0 0 4px #08142180;border-radius:14px}
.portrait{border-color:#e5c477;background:linear-gradient(145deg,#17354b,#091624);box-shadow:0 0 0 2px #09111b, inset 0 0 0 2px #fff2}
.bar{border-color:#3b647a;background:#071524;box-shadow:inset 0 2px 4px #0009}
.fill{box-shadow:inset 0 1px 0 #ffffff55;transition:width .18s ease}
.hp{background:linear-gradient(90deg,#c83250,#ff6577)}.mana{background:linear-gradient(90deg,#168bd4,#55e2ff)}.exp{background:linear-gradient(90deg,#4baf54,#b4f16b)}
#coords{border-color:#4b91a7;background:#071421eF;box-shadow:0 3px 8px #0007;color:#bdeeff}
.topbtn{filter:drop-shadow(0 3px 3px #0009);transition:transform .12s,filter .12s}
.topbtn:active,.control:active{transform:scale(.94);filter:brightness(1.2)}
.actions{filter:drop-shadow(0 4px 5px #0009)}
.window{border:2px solid #54b5c7;border-radius:17px;background:linear-gradient(145deg,#0c2032f7 0%,#081522f8 60%,#07111df9 100%);box-shadow:0 16px 45px #000b,inset 0 0 0 1px #d5faff20,inset 0 1px 0 #fff1;scrollbar-width:thin;scrollbar-color:#3b788b #081522}
.window:before{content:"";position:absolute;inset:5px;border:1px solid #d7c17b25;border-radius:12px;pointer-events:none}
.window h2{color:#f5d992;text-shadow:0 2px 0 #5b4523,0 0 18px #e8bf5b22;letter-spacing:clamp(.5px,.15vw,1.8px);font-weight:900}
.close,.back-button{border:1.5px solid #d8bd79!important;background:linear-gradient(145deg,#193348,#0a1724)!important;box-shadow:inset 0 1px 0 #fff2,0 3px 7px #0007;color:#f7e6b6!important;border-radius:9px!important;transition:filter .12s,transform .12s}
.close:active,.back-button:active{transform:scale(.96);filter:brightness(1.25)}
.goldbtn,.menu-item,.status-tabs .goldbtn,.bestiary-tabs .goldbtn{background:linear-gradient(180deg,#203c4d,#102333 80%);border-color:#b99a58;color:#f7e7bd;box-shadow:inset 0 1px 0 #fff2,inset 0 -2px 0 #0004,0 3px 8px #0005;transition:background .14s,border-color .14s,transform .12s,filter .12s}
.goldbtn:hover,.menu-item:hover,.status-tabs .goldbtn:hover,.bestiary-tabs .goldbtn:hover{filter:brightness(1.14);border-color:#f4d58b}
.goldbtn:active,.menu-item:active{transform:translateY(1px) scale(.99);filter:brightness(1.2)}
button:focus-visible{outline:2px solid #8beaff;outline-offset:2px}
.menu-item{border-radius:11px;position:relative}
.menu-item:before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(#8eeaff,#c8a85e);opacity:.75}
.menu-item img{filter:drop-shadow(0 3px 2px #000b)}
.menu-item .menu-label{color:#f4f7fa;text-shadow:0 1px 2px #000;letter-spacing:.15px}
.status-section,.profile-identity,.profile-info,.equipment-section,.backpack-section,.bestiary-detail,.lore-card{border-color:#31586a!important;background:linear-gradient(145deg,#10283aee,#091724f2)!important;box-shadow:inset 0 1px 0 #fff1,0 3px 10px #0002}
.status-section h3,.profile-info h3,.equipment-section h3,.backpack-section h3,.bestiary-detail h3{color:#f1d28c;text-shadow:0 1px 0 #57411e}
.status-stat,.profile-value,.point-chip,.bestiary-stat{background:linear-gradient(145deg,#183647,#102433)!important;border-color:#2d5262!important;box-shadow:inset 0 1px 0 #fff1}
.status-stat b,.profile-value b{color:#fff1cf}
.point-chip b{color:#f4d58b}
.bestiary-entry{display:flex;align-items:center;gap:8px;background:linear-gradient(145deg,#173246,#0b1927)!important;border-color:#31586a!important;box-shadow:inset 0 1px 0 #fff1,0 2px 6px #0003;transition:border-color .12s,filter .12s,transform .12s}
.bestiary-entry:active{transform:scale(.985)}
.bestiary-entry.active{border-color:#f0cd7b!important;box-shadow:inset 0 0 0 1px #f0cd7b55,0 0 12px #d7b55a18}
.bestiary-entry strong{color:#f4d58b}
.bestiary-entry small{color:#b6d0dc}
.bestiary-entry-icon,.bestiary-entry-placeholder,.bestiary-creature-icon{image-rendering:pixelated;filter:drop-shadow(0 3px 3px #0008)}
.equip-slot{border-color:#496a7b!important;background:linear-gradient(145deg,#1a3042,#0b1724)!important;box-shadow:inset 0 1px 0 #fff2,0 3px 7px #0004;transition:border-color .12s,filter .12s}
.equip-slot:active{filter:brightness(1.2)}
.bag-slot{background:linear-gradient(145deg,#122638,#091521)!important;border-color:#294657!important}
.toast{border-color:#6ed5e7;background:linear-gradient(145deg,#102b3eF5,#071522f5);box-shadow:0 8px 25px #0009;color:#effbff}
.card{border-color:#5bc7df;background:linear-gradient(145deg,#102b42f5,#071426f7);box-shadow:0 14px 40px #000b,inset 0 0 0 1px #e8faff18}
.card h1{color:#f4d58b;text-shadow:0 3px 0 #5c4726,0 0 22px #e3bd6128}
.card h3{color:#8fe6f6}
@media(max-width:600px){
  .window{border-radius:13px;box-shadow:0 10px 28px #000c,inset 0 0 0 1px #d5faff18}
  .window:before{inset:3px;border-radius:9px}
  .menu-item{border-radius:9px}
  .menu-item:before{width:2px}
  .status-stat,.profile-value{box-shadow:inset 0 1px 0 #ffffff0c}
}
@media(prefers-reduced-motion:reduce){.fill,.topbtn,.goldbtn,.menu-item,.bestiary-entry{transition:none!important}}

function goTitle(){document.getElementById('guildQuickExit')?.remove();screen='title';menuOpen=false;settingsOpen=false;showGameUI(false);const ov=document.querySelector('#overlay');ov.className='title-screen';const hasSave=!!loadSave();ov.innerHTML=`<div class="card title-menu-card"><h1>VELKARYS</h1><h3>MUNDO ABERTO</h3><div class="title-menu-grid"><button class="goldbtn" id="titleContinue" ${hasSave?'':'disabled'}>CONTINUAR AVENTURA</button><button class="goldbtn" id="titleNew">COMEÇAR NOVA AVENTURA</button><button class="goldbtn" id="titleInfo">INFORMAÇÕES</button><button class="goldbtn" id="titleSettings">CONFIGURAÇÕES</button></div></div>`;ov.querySelector('#titleContinue').onclick=startSavedAdventure;ov.querySelector('#titleNew').onclick=chooseClass;ov.querySelector('#titleInfo').onclick=()=>{ov.innerHTML='<div class="card title-sub-card"><button class="goldbtn title-back" id="infoBack">‹ VOLTAR</button><h2>INFORMAÇÕES</h2><p>Explore a Vila de Velkarys, converse com os moradores, aceite missões, enfrente slimes e evolua seu aventureiro. As missões aceitas aparecem no painel de missão atual.</p><p>Use os controles direcionais para caminhar, INTERAGIR para falar com personagens e o botão de ataque para combater criaturas.</p></div>';ov.querySelector('#infoBack').onclick=goTitle;};ov.querySelector('#titleSettings').onclick=()=>{ov.innerHTML=`<div class="card title-sub-card"><button class="goldbtn title-back" id="settingsBack">‹ VOLTAR</button><h2>CONFIGURAÇÕES</h2><p>Velocidade de movimento</p><button class="goldbtn" id="titleSpeed">VELOCIDADE: ${player.speed||225}</button><p class="settings-note">Ajuste a velocidade conforme o conforto do seu dispositivo.</p></div>`;ov.querySelector('#settingsBack').onclick=goTitle;ov.querySelector('#titleSpeed').onclick=()=>{const levels=[180,225,285];const current=player.speed||225;player.speed=levels[(levels.indexOf(current)+1+levels.length)%levels.length];ov.querySelector('#titleSpeed').textContent='VELOCIDADE: '+player.speed;try{localStorage.setItem('velkarys_speed',String(player.speed))}catch(e){}};};}

function vkDrawChar(c,x,y,look,klass){

 document.querySelectorAll('.modal').forEach(n=>n.remove());const ov=document.createElement('div');ov.className='overlay modal guild-interior-overlay';

 const paint=()=>{const s=state();const ranks=['E','D','C','B','A','S'];const rank=s.registered?(ranks[Math.min(5,Math.floor((s.points||0)/3))]):'Não registrado';ov.innerHTML=`<div class="window guild-interior-window"><div class="section-header guild-header"><button class="goldbtn" id="guildExit">SAIR</button><h2>GUILDA DOS AVENTUREIROS</h2><span class="guild-mark">✦</span></div><div class="guild-room"><div class="guild-banner">SALÃO DOS AVENTUREIROS</div><div class="guild-table"><span>📜</span><b>MESA DE REGISTRO</b></div><div class="guild-clerk">🧑‍💼<b>Recepcionista: Kael</b><small>Registro · Rank · Contratos</small></div></div><div class="guild-info"><h3>Carteira de aventureiro</h3><p><b>Rank atual:</b> ${rank}</p><p>${s.registered?'Registro ativo. Complete contratos do seu rank para subir de categoria.':'Você ainda não está registrado na guilda.'}</p><p class="guild-ranks">E → D → C → B → A → S</p><div class="guild-actions">${!s.registered?'<button class="goldbtn" id="guildRegister">REGISTRAR-SE · RANK E</button>':'<button class="goldbtn" id="guildContracts">VER CONTRATOS DISPONÍVEIS</button>'}<button class="goldbtn" id="guildLeave">SAIR DA GUILDA</button></div></div></div>`;ov.querySelector('#guildExit').onclick=()=>{ov.remove();modalHistory=[]};ov.querySelector('#guildLeave').onclick=()=>{ov.remove();modalHistory=[]};const reg=ov.querySelector('#guildRegister');if(reg)reg.onclick=()=>{localStorage.setItem('velkarys_guild',JSON.stringify({registered:true,rank:'E',points:0}));showToast('Registro concluído! Você começou no rank E.');paint()};const contracts=ov.querySelector('#guildContracts');if(contracts)contracts.onclick=()=>{const st=state();st.points=(st.points||0)+1;localStorage.setItem('velkarys_guild',JSON.stringify(st));showDialogue('Kael, recepcionista',['Os contratos disponíveis dependem do seu rank. Complete trabalhos da guilda para acumular mérito e subir de E até S.'],[{label:'ENTENDI',run:()=>{showToast('Consulte o quadro da guilda para os próximos contratos.');paint()}}])}};game.appendChild(ov);paint()
}
function interactBuilding(id){if(id==='quest'){showDialogue('Lia, responsável pelas caçadas',['Ei, renascido! O Campo de Caça fica logo ali. Os slimes estão incomodando quem passa pela trilha.','Posso registrar sua primeira missão. Você decide quando estiver pronto.'],[{label:'VER MISSÕES',run:renderMissions},{label:'AGORA NÃO',run:()=>showToast('Lia: estarei por aqui quando precisar.')}]);return}const data={mayor:['Prefeito Aldren',['Você deve ser o renascido que surgiu no portal! Bem-vindo a Velkarys.','A Guilda dos Aventureiros registra feitos e missões. O ferreiro cuida do equipamento, a hospedaria salva seu progresso, a loja compra seus itens e o curandeiro trata seus ferimentos.'],[{label:'ENTENDI',run:()=>showToast('Novo objetivo: conheça a cidade e fale com Lia perto do Campo de Caça.')},{label:'VER MISSÕES',run:renderMissions}]],guild:['Guilda dos Aventureiros',['Bem-vindo à Guilda.'],[{label:'ENTRAR',run:renderGuildInterior},{label:'SAIR',run:()=>{}}]],smith:['Borin, o Ferreiro',['Posso avaliar seu equipamento e preparar melhorias quando trouxer materiais.'],[{label:'AVALIAR EQUIPAMENTO',run:()=>showToast('Borin: traga materiais para desbloquear melhorias.')},{label:'SAIR',run:()=>{}}]],inn:['Mira, Hospedaria',['Um quarto tranquilo restaura suas forças e registra seu ponto de descanso.'],[{label:'DORMIR E SALVAR',run:()=>{player.hp=attrValue('HP');player.mp=attrValue('Mana');player.x=1540;player.y=900;saveGame(false);updateHud();showToast('Você descansou. Vida e mana restauradas, jogo salvo!')}},{label:'SAIR',run:()=>{}}]],shop:['Tomas, Loja de Itens',['Compro materiais e itens que você não precisa mais.'],[{label:'VENDER ITENS',run:()=>openShop('sell')},{label:'SAIR',run:()=>{}}]],healer:['Nara, Curandeira',['Poções simples para aventureiros. Uma poção custa 10 moedas e restaura 35 HP.'],[{label:'COMPRAR POÇÃO · 10 🪙',run:()=>{if(player.gold<10){showToast('Você precisa de 10 moedas.');return;}player.gold-=10;player.hp=Math.min(attrValue('HP'),player.hp+35);saveGame(false);updateHud();showToast('Poção usada: até 35 HP restaurados.')}},{label:'TRATAR FERIMENTOS · 5 🪙',run:()=>{if(player.gold<5){showToast('Você precisa de 5 moedas.');return;}player.gold-=5;player.hp=attrValue('HP');player.mp=attrValue('Mana');saveGame(false);updateHud();showToast('Você está recuperado!')}},{label:'SAIR',run:()=>{}}]]};const d=data[id];if(d)showDialogue(d[0],d[1],d[2])}
function openShop(){const ov=document.createElement('div');ov.className='overlay modal';ov.innerHTML=`<div class="window shop-window"><h2>LOJA DE ITENS</h2><button class="close" id="closeShop">X</button><p>O mercador compra materiais coletados durante a aventura.</p><div class="shop-row"><span>Gelatina Brilhante</span><b>2 moedas</b><button class="goldbtn" id="sellGel">VENDER 1</button></div><p>Inventário de materiais: ${player.gel||0} gelatina(s).</p></div>`;game.appendChild(ov);addBackButton(ov);ov.querySelector('#closeShop').onclick=()=>ov.remove();ov.querySelector('#sellGel').onclick=()=>{if((player.gel||0)<1){showToast('Você não tem materiais para vender.');return;}player.gel--;player.gold+=2;saveGame(false);showToast('Gelatina vendida por 2 moedas.');openShop()}}
function startIntro(){screen='intro';showGameUI(false);const ov=document.querySelector('#overlay');ov.className='title-screen intro-screen';let stage=0;const scenes=[{title:'Deus Criador',text:'Bom dia ou boa noite, meu jovem. No momento em que você entrar nesta realidade, neste mundo novo de experiências que estou desenvolvendo, espero que se divirta ao máximo e fique forte o bastante para mudar o destino deste mundo. Boa sorte, jogador.'},{title:'O Portal da Reencarnação',text:'O ar vibra. Um portal de luz se abre no centro da praça, e uma onda de energia atravessa a cidade.'},{title:'A população de Velkarys',text:'Um renascido! Chamem o prefeito! Afastem-se do portal!'},{title:'O prefeito vem correndo',text:'O prefeito Aldren atravessa a praça às pressas para encontrar você. Os guardas abrem caminho enquanto os moradores observam o recém-chegado.'}];const paint=()=>{const a=scenes[stage];ov.innerHTML=`<div class="intro-card"><div class="portal-art ${stage===1?'portal-open':stage===3?'mayor-running':''}"><span></span></div><h2>${a.title}</h2><p>${a.text}</p><button class="goldbtn" id="introNext">${stage===scenes.length-1?'ENTRAR EM VELKARYS':'CONTINUAR ▶'}</button></div>`;ov.querySelector('#introNext').onclick=()=>{if(stage<scenes.length-1){stage++;paint()}else{ov.className='hidden';screen='game';showGameUI(true);player.x=1540;player.y=900;player.storyStarted=true;updateHud();refreshMissionHud();saveGame(false);showToast('Capítulo 1 iniciado! Procure o prefeito na praça.');showDialogue('Prefeito Aldren',['Você surgiu do portal! Venha comigo, vou explicar como funciona Velkarys.','A cidade tem uma guilda, ferreiro, hospedaria, loja e curandeira. Ao leste fica o Campo de Caça. Procure Lia perto da entrada quando quiser sua primeira missão.'],[{label:'VAMOS CONHECER A CIDADE',run:()=>{player.storyMayorDone=true;saveGame(false);showToast('Explore a vila e interaja perto das construções.')}}])}}};paint()}
function renderInventory(){
 document.querySelectorAll('.modal').forEach(n=>n.remove());
 const ov=document.createElement('div');ov.className='overlay modal';
 const gear=['Anel','Capacete','Colar','Arma','Armadura','Escudo','Botas','Calça','Acessório'];
 ov.innerHTML=`<div class="window inventory-window"><h2>INVENTÁRIO</h2><div class="coin-wallet" id="coinWallet" aria-label="Saldo de moedas"><span aria-hidden="true">🪙</span><b id="coinWalletValue">${Math.max(0,Number(player.gold)||0)}</b></div><button class="close" id="closeInventory">X</button><div class="inventory-content"><section class="equipment-section"><h3>EQUIPAMENTOS <small>Vazios</small></h3><div class="equipment-grid">${gear.map(name=>`<button class="equip-slot empty-equipment" title="Nenhum equipamento equipado: ${name}" aria-label="Espaço de ${name}, vazio"><span class="slot-icon">—</span><span class="slot-name">${name}</span></button>`).join('')}</div></section><section class="backpack-section"><h3>MOCHILA</h3><div class="backpack-grid">${Array.from({length:50},(_,i)=>`<button class="bag-slot" data-bag-index="${i}" aria-label="Espaço ${i+1}" title="Espaço vazio"><span>${i+1}</span></button>`).join('')}</div></section></div></div>`;
 game.appendChild(ov);addBackButton(ov);ov.querySelector('#closeInventory').onclick=()=>{ov.remove();modalHistory=[]};
 const bag=[...ov.querySelectorAll('[data-bag-index]')];
 const count=Math.max(0,Number(player.gel)||0);
 if(count>0&&bag[0]){bag[0].innerHTML=`<img src="assets/monsters/slime_water_icon.png" alt="Gelatina Brilhante" style="width:78%;height:78%;object-fit:contain;image-rendering:pixelated"><b style="position:absolute;right:2px;bottom:1px;color:#fff;font-size:10px;text-shadow:1px 1px #000">${count}</b>`;bag[0].style.position='relative';bag[0].title='Gelatina Brilhante × '+count;bag[0].setAttribute('aria-label','Gelatina Brilhante, quantidade '+count);}
 const showDetail=()=>{let d=ov.querySelector('#itemDetail');if(!d){d=document.createElement('div');d.id='itemDetail';d.className='item-detail';ov.querySelector('.inventory-window').appendChild(d)}d.innerHTML=`<button class="close" id="itemDetailClose" aria-label="Fechar detalhes">×</button><h3><img src="assets/monsters/slime_water_icon.png" alt="" style="width:28px;height:28px;object-fit:contain;vertical-align:middle"> Gelatina Brilhante</h3><p><b>Tipo:</b> Material de monstro</p><p><b>Raridade:</b> Comum</p><p><b>Quantidade:</b> ${Math.max(0,Number(player.gel)||0)}</p><p>Gelatina deixada por um slime. Pode ser usada em receitas ou entregue em trabalhos.</p><div class="item-actions"><button class="goldbtn" id="useItem">USAR</button><button class="goldbtn" id="equipItem" disabled title="Materiais não podem ser equipados">EQUIPAR</button><button class="goldbtn" id="discardItem">DESCARTAR 1</button></div>`;
 d.querySelector('#itemDetailClose').onclick=()=>d.remove();d.querySelector('#useItem').onclick=()=>{const count=Math.max(0,Number(player.gel)||0);if(!count){showToast('Você não tem Gelatina Brilhante.');d.remove();return;}const maxHp=attrValue('HP');if((player.hp??maxHp)>=maxHp){showToast('Seu HP já está cheio. A gelatina foi preservada.');return;}player.hp=Math.min(maxHp,(player.hp??maxHp)+10);player.gel=count-1;saveGame(false);updateHud();refreshInventoryBag();if(player.gel>0)showDetail();else d.remove();showToast('Gelatina usada: +10 HP.');};d.querySelector('#equipItem').onclick=()=>showToast('Gelatina Brilhante é um material e não pode ser equipada.');d.querySelector('#discardItem').onclick=()=>{player.gel=Math.max(0,(Number(player.gel)||0)-1);saveGame(false);refreshInventoryBag();if(player.gel<=0)d.remove();else showDetail();showToast('1 Gelatina Brilhante descartada.');};};
 function refreshInventoryBag(){const slot=bag[0];if(!slot)return;const n=Math.max(0,Number(player.gel)||0);if(n>0){slot.innerHTML=`<img src="assets/monsters/slime_water_icon.png" alt="Gelatina Brilhante" style="width:78%;height:78%;object-fit:contain;image-rendering:pixelated"><b style="position:absolute;right:2px;bottom:1px;color:#fff;font-size:10px;text-shadow:1px 1px #000">${n}</b>`;slot.style.position='relative';slot.title='Gelatina Brilhante × '+n;slot.setAttribute('aria-label','Gelatina Brilhante, quantidade '+n);}else{slot.innerHTML='<span>1</span>';slot.removeAttribute('title');slot.setAttribute('aria-label','Espaço vazio da mochila');}}
 bag.forEach((b,i)=>b.onclick=()=>{if(i===0&&Math.max(0,Number(player.gel)||0)>0)showDetail();else showToast('Este espaço da mochila está vazio.')});
 ov.querySelectorAll('.empty-equipment').forEach(b=>b.onclick=()=>showToast('Nenhum equipamento foi adicionado ao jogo ainda. Este espaço está vazio.'));
}
const BESTIARY={
 Monstros:[
  {name:'Slime Nível 1',level:1,rank:'Comum',hp:10,mp:0,atk:2,def:1,matk:0,speed:'1 (muito baixa)',xp:5,buffs:['Gosma Ácida (passiva): contato sem proteção deixa as mãos melequentas','Pulo Fofo (ativa): salta 10 cm para frente'],drop:'1× Gelatina Brilhante · venda: 2 moedas de cobre',element:'Água / Neutro',desc:'Criatura inicial do tipo Monstro / Gosma. Uma pequena massa gelatinosa que mal consegue avançar.'}
 ],

let bestiaryArea='Monstros',bestiarySelected=0;
function renderBestiary(){document.querySelectorAll('.modal').forEach(n=>n.remove());const ov=document.createElement('div');ov.className='overlay modal';ov.innerHTML=`<div class="window bestiary-window"><button class="close" id="closeBestiary">X</button><div class="bestiary-header"><button class="goldbtn ${bestiaryArea==='Monstros'?'active-tab':''}" data-area="Monstros">🐾 MONSTROS</button><h2>BESTIÁRIO</h2><button class="goldbtn ${bestiaryArea==='Bosses'?'active-tab':''}" data-area="Bosses">👑 BOSSES</button></div><div class="bestiary-list" id="bestiaryList"></div><section class="bestiary-detail hidden" id="bestiaryDetail"></section></div>`;game.appendChild(ov);addBackButton(ov);const draw=()=>{const entries=BESTIARY[bestiaryArea];bestiarySelected=Math.min(bestiarySelected,entries.length-1);ov.querySelectorAll('[data-area]').forEach(b=>b.classList.toggle('active-tab',b.dataset.area===bestiaryArea));ov.querySelector('#bestiaryList').innerHTML=entries.length?entries.map((e,i)=>`<button class="bestiary-entry ${i===bestiarySelected?'active':''}" data-entry="${i}">${e.name==='Slime Nível 1'?'<img class="bestiary-entry-icon" src="assets/monsters/slime_water_icon.png" alt="Slime de água">':'<span class="bestiary-entry-placeholder" aria-hidden="true">🐾</span>'}<span class="bestiary-entry-copy"><strong>${e.name}</strong><small>Nível ${e.level}</small></span></button>`).join(''):'<p class="bestiary-entry">Nenhum boss registrado ainda.</p>';ov.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{bestiarySelected=Number(b.dataset.entry);const list=ov.querySelector('#bestiaryList'),detail=ov.querySelector('#bestiaryDetail');list.classList.add('hidden');detail.classList.remove('hidden');drawDetail()});};const drawDetail=()=>{const entries=BESTIARY[bestiaryArea],e=entries[bestiarySelected];ov.querySelector('#bestiaryDetail').innerHTML=`<h3>${e.name} <small style="color:#a9cbd8;font-weight:500">· Nível ${e.level} · ${e.rank}</small></h3>${e.name==='Slime Nível 1'?'<img src="assets/monsters/slime_water_icon.png" alt="Slime de Água" class="bestiary-creature-icon">':''}<p style="margin:4px 0 8px;color:#cbdde6;font-size:clamp(10px,1.1vw,13px)">${e.desc}</p><p><b>Tipo:</b> Monstro / Gosma · <b>Elemento:</b> ${e.element||'Neutro'}</p><div class="bestiary-stats"><div class="bestiary-stat">Vida (HP)<b>${e.hp} / ${e.hp}</b></div><div class="bestiary-stat">Mana (MP)<b>${e.mp??0} / ${e.mp??0}</b></div><div class="bestiary-stat">Ataque (ATK)<b>${e.atk}</b></div><div class="bestiary-stat">Defesa (DEF)<b>${e.def}</b></div><div class="bestiary-stat">Magia (MATK)<b>${e.matk}</b></div><div class="bestiary-stat">Velocidade<b>${e.speed}</b></div><div class="bestiary-stat">Recompensa<b>${e.xp} XP</b></div></div><h3 style="margin-top:9px">Buffs e habilidades</h3><div class="bestiary-buffs">${e.buffs.map(buff=>`<span class="buff-tag">${buff}</span>`).join('')}</div>${e.drop?`<p style="margin-top:8px"><b>Drop:</b> ${e.drop}</p>`:''}<button class="goldbtn" id="backToBestiaryList" style="margin-top:10px">‹ VOLTAR À LISTA</button>`;ov.querySelector('#backToBestiaryList').onclick=()=>{ov.querySelector('#bestiaryDetail').classList.add('hidden');ov.querySelector('#bestiaryList').classList.remove('hidden')}};ov.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{bestiaryArea=b.dataset.area;bestiarySelected=0;draw()});ov.querySelector('#closeBestiary').onclick=()=>{ov.remove();modalHistory=[]};draw();}

function renderProfile(){document.querySelectorAll('.modal').forEach(n=>n.remove());const ov=document.createElement('div');ov.className='overlay modal';ov.innerHTML=`<div class="window profile-window"><h2>DETALHES DO JOGADOR</h2><button class="close" id="closeProfile">X</button><div class="profile-layout"><section class="profile-identity"><img src="${asset('profile_menu')}" alt="Retrato do aventureiro"><div><h3>${player.name||'Ren'}</h3><p>${player.klass||'Aventureiro'}</p><p>Nível ${player.level} / 50</p></div></section><section class="profile-info"><h3>INFORMAÇÕES GERAIS</h3><div class="profile-grid"><div class="profile-value"><small>Experiência (XP)</small><b>${player.xp} / ${player.xpNext}</b></div><div class="profile-value"><small>Ouro</small><b>🪙 ${player.gold}</b></div><div class="profile-value"><small>Vida (HP)</small><b>${Math.ceil(player.hp??attrValue('HP'))} / ${attrValue('HP')}</b></div><div class="profile-value"><small>Mana (MP)</small><b>${attrValue('Mana')} / ${attrValue('Mana')}</b></div><div class="profile-value"><small>Ataque (ATK)</small><b>${attrValue('ATK')}</b></div><div class="profile-value"><small>Defesa (DEF)</small><b>${attrValue('DEF')}</b></div><div class="profile-value"><small>Pontos disponíveis</small><b>${player.freePoints}</b></div><div class="profile-value"><small>Classe</small><b>${player.klass||'Aventureiro'}</b></div></div></section></div><div class="panel-actions"><button class="goldbtn" id="profileStatus">VER STATUS E ATRIBUTOS</button></div></div>`;game.appendChild(ov);addBackButton(ov);ov.querySelector('#closeProfile').onclick=()=>{ov.remove();modalHistory=[]};ov.querySelector('#profileStatus').onclick=()=>{pushModal('profile');statusTab='Totais';renderStatus()};}

function updateMonsters(dt){

  m.x=Math.max(field.left,Math.min(field.right,m.x));m.y=Math.max(field.top,Math.min(field.bottom,m.y));
  const contact=Math.hypot(player.x-m.x,player.y-m.y);

  if(!playerInside){m.windup=0;continue;}

  if(m.hitFlash>0)m.hitFlash-=dt;
 }
}

<script id="velkarys-v1-9-5-interaction-exit-dialogue-fix">
(()=>{
 'use strict';
 // Keep the dialogue box, but remove its extra X button. The single INTERAGIR
 // control advances text and activates a lone confirmation when appropriate.
 let dialogueState=null;
 const originalShowDialogue=window.showDialogue;
 window.showDialogue=function(name,lines,choices){
   document.querySelectorAll('#game .modal').forEach(n=>n.remove());
   const ov=document.createElement('div');ov.className='overlay modal dialogue-overlay';
   const textLines=Array.isArray(lines)&&lines.length?lines:[String(lines||'')];
   const opts=Array.isArray(choices)?choices:[];
   let index=0,done=false;
   const finish=()=>{done=true;ov.remove();if(dialogueState&&dialogueState.ov===ov)dialogueState=null;};
   const runChoice=(i)=>{const c=opts[i];if(!c)return;finish();try{c.run&&c.run()}catch(err){console.error('Dialogue choice failed',err)}};
   const paint=()=>{
     ov.innerHTML=`<div class="window dialogue-window" role="dialog" aria-label="Diálogo com ${String(name).replace(/[<>]/g,'')}"><div class="dialogue-copy"><h2>${String(name)}</h2><p>${String(textLines[index]||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>${index<textLines.length-1?'<button class="goldbtn" id="dialogueNext">CONTINUAR ▶</button>':opts.map((c,i)=>`<button class="goldbtn" data-choice="${i}">${String(c.label||'CONTINUAR').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</button>`).join('')}</div></div>`;
     const next=ov.querySelector('#dialogueNext');if(next)next.onclick=()=>{index=Math.min(index+1,textLines.length-1);paint()};
     ov.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>runChoice(Number(b.dataset.choice)));
   };
   dialogueState={ov,advance:()=>{
     if(done)return false;
     if(index<textLines.length-1){index++;paint();return true;}
     if(opts.length===1){runChoice(0);return true;}
     if(opts.length===0){finish();return true;}
     return false;
   }};
   game.appendChild(ov);paint();return ov;
 };
 // Let the one interaction button advance dialogue instead of accidentally
 // targeting an NPC or door behind the speech card.
 const ib=document.getElementById('interactBtn');
 if(ib){ib.onclick=(ev)=>{if(ev){ev.preventDefault();ev.stopPropagation()}if(dialogueState){dialogueState.advance();return}if(typeof window.interactNearby==='function')window.interactNearby();else if(typeof interactNearby==='function')interactNearby()};}
 // A touch on the dialogue card itself is also a natural Pokémon-style Continue.
 document.addEventListener('click',ev=>{
   const card=ev.target&&ev.target.closest&&ev.target.closest('.dialogue-window');
   if(!card||ev.target.closest('button'))return;
   if(dialogueState)dialogueState.advance();
 },true);
 // Guild interaction: choose the nearest target, with a narrow door radius so
 // the doorway never steals Kael's interaction just because both are nearby.
 const priorInteract=window.interactNearby;
 window.interactNearby=function(){
   if(typeof window.velkarysGetScreen==='function'&&window.velkarysGetScreen()!=='game')return;
   if(typeof velkarysMapZone!=='undefined'&&velkarysMapZone==='guild'){
     const npc={x:400,y:155,d:Math.hypot(player.x-400,player.y-155)};
     const door={x:400,y:300,d:Math.hypot(player.x-400,player.y-300)};
     if(door.d<=54&&door.d<=npc.d){
       velkarysMapZone='world';player.x=1396;player.y=850;
       const b=document.getElementById('guildQuickExit');if(b)b.remove();
       if(typeof saveGame==='function')saveGame(false);if(typeof drawWorld==='function')drawWorld();
       if(typeof showToast==='function')showToast('Você saiu da Guilda e voltou à vila.');return;
     }
     if(npc.d<=112){
       let st={registered:false,points:0};try{st=JSON.parse(localStorage.getItem('velkarys_guild')||'{"registered":false,"points":0}')}catch(e){}
       const ranks=['E','D','C','B','A','S'];const rank=st.registered?ranks[Math.min(5,Math.floor((st.points||0)/3))]:'E';
       if(!st.registered){
         showDialogue('Kael · Recepcionista',['Bem-vindo à Guilda dos Aventureiros. Seu registro começa no rank E. Deseja se registrar?'],[
           {label:'REGISTRAR · RANK E',run:()=>{localStorage.setItem('velkarys_guild',JSON.stringify({registered:true,points:0,rank:'E'}));if(typeof saveGame==='function')saveGame(false);showToast('Registro concluído. Rank E desbloqueado.')}},
           {label:'AGORA NÃO',run:()=>{}}
         ]);
       }else{
         showDialogue('Kael · Recepcionista',['Seu registro está ativo no rank '+rank+'. Posso oferecer contratos da guilda.'],[
           {label:'ACEITAR · PATRULHA',run:()=>{let j;try{j=JSON.parse(localStorage.getItem('velkarys_jobs')||'{"accepted":[],"completed":[],"progress":{}}')}catch(e){j={accepted:[],completed:[],progress:{}}}if(!j.accepted.includes('job_patrol')&&!j.completed.includes('job_patrol'))j.accepted.push('job_patrol');localStorage.setItem('velkarys_jobs',JSON.stringify(j));if(typeof saveGame==='function')saveGame(false);showToast('Contrato aceito: Patrulha da trilha.')}},
           {label:'ACEITAR · ERVAS',run:()=>{let j;try{j=JSON.parse(localStorage.getItem('velkarys_jobs')||'{"accepted":[],"completed":[],"progress":{}}')}catch(e){j={accepted:[],completed:[],progress:{}}}if(!j.accepted.includes('job_herbs')&&!j.completed.includes('job_herbs'))j.accepted.push('job_herbs');localStorage.setItem('velkarys_jobs',JSON.stringify(j));if(typeof saveGame==='function')saveGame(false);showToast('Contrato aceito: Entrega de ervas.')}},
           {label:'FECHAR',run:()=>{}}
         ]);
       }
       return;
     }
     if(typeof showToast==='function')showToast('Aproxime-se de Kael ou da porta de saída e toque em INTERAGIR.');return;
   }
   if(typeof priorInteract==='function')return priorInteract();
 };
 // Ensure the guild door remains usable even if the player approaches from an angle.
 const priorDraw=window.drawWorld;
 window.drawWorld=function(){if(typeof priorDraw==='function')priorDraw();if(typeof ensureGuildExitButton==='function')ensureGuildExitButton()};
 // Autosave when the page is hidden or closed, and return to title without
 // wiping the active character when the player chooses to leave the adventure.
 window.addEventListener('pagehide',()=>{try{if(typeof window.velkarysGetScreen==='function'&&window.velkarysGetScreen()==='game'&&typeof saveGame==='function')saveGame(false)}catch(e){}});
 document.addEventListener('visibilitychange',()=>{try{if(document.visibilityState==='hidden'&&typeof screen!=='undefined'&&screen==='game'&&typeof saveGame==='function')saveGame(false)}catch(e){}});
 const priorRenderAdventure=window.renderAdventure;
 window.renderAdventure=function(){
   if(typeof priorRenderAdventure==='function')priorRenderAdventure();
   const win=document.querySelector('#game .adventure-window');if(!win||win.querySelector('#leaveAdventure'))return;
   const grid=win.querySelector('.menu-grid');if(grid){grid.style.flex='1 1 auto';grid.style.minHeight='0';grid.style.marginBottom='5px'}
   win.style.display='flex';win.style.flexDirection='column';win.style.paddingBottom='8px';
   const b=document.createElement('button');b.id='leaveAdventure';b.className='goldbtn';b.textContent='SALVAR E SAIR PARA O MENU';
   b.style.cssText='flex:0 0 auto;align-self:center;width:min(320px,92%);min-height:29px;padding:5px 9px;font-size:10px;line-height:1.15;touch-action:manipulation';
   b.onclick=()=>{try{saveGame(false)}catch(e){};if(dialogueState){dialogueState.ov.remove();dialogueState=null}document.querySelectorAll('#game .modal').forEach(n=>n.remove());held&&held.clear&&held.clear();keyHeld&&keyHeld.clear&&keyHeld.clear();pointerDirs&&pointerDirs.clear&&pointerDirs.clear();goTitle();showToast('Progresso salvo. Você voltou ao menu principal.')};win.appendChild(b);
 };
 // Fix the direct Settings return action as well: save, clear overlays and go to title.
 const returnButton=document.getElementById('returnBtn');if(returnButton)returnButton.onclick=()=>{try{saveGame(false)}catch(e){};document.querySelectorAll('#game .modal').forEach(n=>n.remove());goTitle();showToast('Progresso salvo. Você voltou ao menu principal.')};
})();
</script>

<script id="velkarys-v1-9-7-healer-shop-ranks">
(()=>{'use strict';
  const oldInteractBuilding=window.interactBuilding;
  function openHealerShop(){
    document.querySelectorAll('#game .modal').forEach(n=>n.remove());
    const ov=document.createElement('div');ov.className='overlay modal';game.appendChild(ov);
    const items=[
      {id:'small',name:'Poção de Mana Pequena',restore:15,price:5,desc:'+15 MP'},
      {id:'medium',name:'Poção de Mana Média',restore:30,price:10,desc:'+30 MP'},
      {id:'large',name:'Poção de Mana Grande',restore:60,price:18,desc:'+60 MP'}
    ];
    const balance=()=>Math.max(0,Number(player.gold)||0);
    const stock=()=>{player.manaPotions=player.manaPotions||{small:0,medium:0,large:0};return player.manaPotions};
    const paint=()=>{
      const p=stock();
      ov.innerHTML=`<div class="window healer-shop-window"><h2>CURANDEIRA NARA</h2><div class="coin-wallet shop-wallet">🪙 <b id="healerCoins">${balance()}</b></div><button class="close" id="closeHealerShop" aria-label="Fechar">X</button><p>Escolha uma poção. O preço e a recuperação ficam visíveis antes da compra.</p>${items.map(i=>`<div class="shop-row"><span><b>🧪 ${i.name}</b><small style="display:block;color:#b9d3df">Consumível · ${i.desc} · Na mochila: ${Number(p[i.id])||0}</small></span><b class="price">${i.price} 🪙</b><button class="goldbtn buy-potion" data-buy="${i.id}" ${balance()<i.price?'disabled':''}>COMPRAR</button></div>`).join('')}<p class="shop-balance">Saldo disponível: 🪙 ${balance()}</p><button class="goldbtn" id="healFull">RECUPERAR HP E MANA · 8 🪙</button></div>`;
      ov.querySelector('#closeHealerShop').onclick=()=>{ov.remove();modalHistory=[]};
      ov.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=items.find(x=>x.id===b.dataset.buy);if(!i)return;if(balance()<i.price){showToast('Você precisa de '+i.price+' moedas para comprar esta poção.');return}player.gold=balance()-i.price;stock()[i.id]=(Number(stock()[i.id])||0)+1;saveGame(false);if(typeof updateHud==='function')updateHud();showToast(i.name+' comprada e guardada na mochila.');paint()});
      ov.querySelector('#healFull').onclick=()=>{if(balance()<8){showToast('Você precisa de 8 moedas.');return}player.gold=balance()-8;player.hp=typeof attrValue==='function'?attrValue('HP'):player.hp;player.mp=typeof attrValue==='function'?attrValue('Mana'):player.mp;saveGame(false);if(typeof updateHud==='function')updateHud();showToast('HP e mana totalmente restaurados.');paint()};
      ov.addEventListener('click',e=>{if(e.target===ov){ov.remove();modalHistory=[]}});
    };paint();
  }
  window.interactBuilding=function(id){if(id==='healer'){openHealerShop();return}if(typeof oldInteractBuilding==='function')return oldInteractBuilding(id)};
  // Keep the E → D → C → B → A → S adventurer progression visible, highlighting the current rank.
  const oldGuildInterior=window.renderGuildInterior;
  window.renderGuildInterior=function(){
    if(typeof oldGuildInterior==='function')oldGuildInterior();
    const win=document.querySelector('#game .guild-interior-window');if(!win)return;
    const ranks=['E','D','C','B','A','S'];let st={registered:false,points:0};try{st=JSON.parse(localStorage.getItem('velkarys_guild')||'{"registered":false,"points":0}')}catch(e){}
    const current=st.registered?ranks[Math.min(5,Math.floor((Number(st.points)||0)/3))]:'E';
    const old=win.querySelector('.guild-ranks');if(old)old.innerHTML=ranks.map(r=>`<span class="rank-badge ${st.registered&&r===current?'current':''}" title="Rank ${r}">${r}</span>`).join('');
  };
})();
</script>

<script id="velkarys-all-previous-requests">
(()=>{'use strict';
 const $=s=>document.querySelector(s); const game=$('#game')||document.body;
 const safeSave=()=>{try{if(typeof saveGame==='function')saveGame(false)}catch(e){console.warn(e)}};
 const toast=m=>{try{if(typeof showToast==='function')showToast(m);else alert(m)}catch(e){}};
 // Dialogue: name shares the top row with X; full text and CONTINUAR remain visible.
 window.showDialogue=function(name,lines,choices){
   document.querySelectorAll('#game .dialogue-overlay').forEach(n=>n.remove());
   const textLines=(Array.isArray(lines)?lines:[lines]).map(v=>String(v??'')); const opts=Array.isArray(choices)?choices:[]; let index=0,closed=false;
   const ov=document.createElement('div');ov.className='overlay modal dialogue-overlay';
   const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
   const finish=()=>{closed=true;ov.remove()};
   const paint=()=>{ov.innerHTML=`<div class="window dialogue-window" role="dialog" aria-label="Diálogo com ${esc(name)}"><div class="dialogue-copy"><h2>${esc(name)}</h2><p>${esc(textLines[index]||'')}</p>${index<textLines.length-1?'<button type="button" class="goldbtn" id="dialogueNext">CONTINUAR ▸</button>':opts.map((c,i)=>`<button type="button" class="goldbtn" data-choice="${i}">${esc(c.label||'CONTINUAR')}</button>`).join('')}</div><button type="button" class="close" id="closeDialogue" aria-label="Fechar diálogo">X</button></div>`;
     ov.querySelector('#closeDialogue').onclick=finish;
     const next=ov.querySelector('#dialogueNext');if(next)next.onclick=()=>{index=Math.min(index+1,textLines.length-1);paint()};
     ov.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const c=opts[Number(b.dataset.choice)];finish();try{if(c&&typeof c.run==='function')c.run()}catch(e){console.error(e);toast('Não foi possível concluir essa ação.')}});
   };
   game.appendChild(ov);paint();return ov;
 };
 const gear=[
  ['anel_ferro','Anel de Ferro','Acessório','ATK +1',5],['elmo_ferro','Elmo de Ferro','Cabeça','DEF +2',10],['pingente_safira','Pingente de Safira','Acessório','MP +3 · MATK +1',12],['espada_ferro','Espada de Ferro','Arma','ATK +2',15],['armadura_ferro','Armadura de Ferro','Peitoral','HP +3 · DEF +2 · MDEF +1',18],['escudo_madeira','Escudo de Madeira Reforçado','Escudo','DEF +2',10],['botas_couro','Botas de Couro','Pés','DEF +1 · EVA +1',8],['calcas_couro','Calças de Couro','Pernas','HP +2 · DEF +1 · EVA +1',9]
 ].map(([id,name,slot,bonus,price])=>({id,name,slot,bonus,price,img:`assets/items/shop/${id}.png`}));
 const potions=[
  {id:'pocao_hp',name:'Poção de HP',desc:'Recupera 15 HP',price:3,img:'assets/items/shop/pocao_hp.png',type:'hp'},
  {id:'small',name:'Poção de Mana Pequena',desc:'Recupera até 15 MP',price:5,img:'assets/items/shop/pocao_mana.png',type:'mana'},
  {id:'medium',name:'Poção de Mana Média',desc:'Recupera até 30 MP',price:10,img:'assets/items/shop/pocao_mana.png',type:'mana'},
  {id:'large',name:'Poção de Mana Grande',desc:'Recupera até 60 MP',price:18,img:'assets/items/shop/pocao_mana.png',type:'mana'}
 ];
 function openCatalog(kind){
  document.querySelectorAll('#game .modal').forEach(n=>n.remove());
  const ov=document.createElement('div');ov.className='overlay modal';game.appendChild(ov);let tab=kind==='alchemy'?'potions':kind==='sell'?'sell':'equipment';
  const coins=()=>Math.max(0,Number(window.player?.gold)||0), gel=()=>Math.max(0,Number(window.player?.gel)||0);
  const catalog=()=>tab==='potions'?potions:gear;
  const paint=()=>{
   const items=catalog();
   ov.innerHTML=`<div class="window shop-window"><h2>${kind==='alchemy'?'ALQUIMISTA · POÇÕES':kind==='smith'?'FERREIRO · EQUIPAMENTOS':'LOJA · MATERIAIS'}</h2><div class="coin-wallet shop-wallet">🪙 <b>${coins()}</b></div><button class="close" id="shopClose" aria-label="Fechar loja">X</button><div class="shop-tabs">${kind==='alchemy'?'<button class="goldbtn" data-tab="potions">POÇÕES</button>':'<button class="goldbtn" data-tab="equipment">COMPRAR EQUIPAMENTOS</button><button class="goldbtn" data-tab="sell">VENDER MATERIAIS</button>'}</div>${tab==='sell'?`<div class="shop-catalog"><article class="shop-item-card"><img src="assets/monsters/slime_water_icon.png" alt="Gelatina Brilhante"><strong>Gelatina Brilhante</strong><small>Material comum · ${gel()} disponível(is)</small><small>Preço: 2 moedas por unidade</small><button class="goldbtn" id="sellOne" ${gel()<1?'disabled':''}>VENDER 1</button><button class="goldbtn" id="sellAll" ${gel()<1?'disabled':''}>VENDER TUDO</button></article></div>`:`<div class="shop-catalog">${items.map(it=>`<article class="shop-item-card"><img src="${it.img}" alt="${it.name}"><strong>${it.name}</strong><small>${it.slot||'Consumível'}</small><small>${it.bonus||it.desc}</small><small>Preço: ${it.price} 🪙</small><button class="goldbtn" data-buy="${it.id}">COMPRAR</button></article>`).join('')}</div>`}<p class="shop-balance">Saldo disponível: 🪙 ${coins()}</p></div>`;
   ov.querySelector('#shopClose').onclick=()=>ov.remove();ov.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;paint()});
   ov.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const it=[...gear,...potions].find(x=>x.id===b.dataset.buy);if(!it||!window.player)return;if(coins()<it.price){toast('Moedas insuficientes para comprar '+it.name+'.');return;}player.gold=coins()-it.price;
    if(it.type==='hp')player.hpPotions=(Number(player.hpPotions)||0)+1;
    else if(it.type==='mana'){player.manaPotions=player.manaPotions||{small:0,medium:0,large:0};player.manaPotions[it.id]=(Number(player.manaPotions[it.id])||0)+1;}
    else {player.purchasedEquipment=Array.isArray(player.purchasedEquipment)?player.purchasedEquipment:[];player.purchasedEquipment.push({id:it.id,name:it.name,slot:it.slot,bonus:it.bonus,price:it.price,img:it.img,level:1,rarity:'Comum'});}
    safeSave();if(typeof updateHud==='function')updateHud();toast('Compra concluída: '+it.name+'.');paint();
   });
   const sellOne=ov.querySelector('#sellOne'),sellAll=ov.querySelector('#sellAll');const sell=n=>{const qty=Math.min(gel(),n);if(qty<1){toast('Você não tem Gelatina Brilhante para vender.');return;}player.gel=gel()-qty;player.gold=coins()+qty*2;safeSave();if(typeof updateHud==='function')updateHud();toast(`${qty} Gelatina(s) vendida(s) por ${qty*2} moedas.`);paint()};if(sellOne)sellOne.onclick=()=>sell(1);if(sellAll)sellAll.onclick=()=>sell(gel());
  };paint();
 }
 const oldInteractBuilding=window.interactBuilding;
 window.interactBuilding=function(id){
  if(id==='smith'){window.showDialogue('Borin · Ferreiro',['Tenho oito equipamentos comuns de nível 1 para o início da aventura. Escolha cada item no catálogo para ver a imagem, os bônus e o preço.'],[{label:'ABRIR LOJA DO FERREIRO',run:()=>openCatalog('smith')},{label:'SAIR',run:()=>{}}]);return;}
  if(id==='healer'){window.showDialogue('Nara · Alquimista',['Vendo poções de HP e mana. O painel mostra a imagem, o preço e o efeito de cada poção antes da compra.'],[{label:'ABRIR LOJA DO ALQUIMISTA',run:()=>openCatalog('alchemy')},{label:'SAIR',run:()=>{}}]);return;}
  if(id==='shop'){window.showDialogue('Tomas · Mercador',['Você pode vender materiais somente nesta loja. O inventário não é o local de venda.'],[{label:'ABRIR LOJA PARA VENDER',run:()=>openCatalog('sell')},{label:'SAIR',run:()=>{}}]);return;}
  if(id==='mayor'){window.showDialogue('Prefeito Aldren',['Bem-vindo a Velkarys, renascido. A guilda registra aventureiros e oferece contratos por rank.','Fale com Kael dentro da guilda para se registrar e aceitar contratos. Lia registra missões da vila.'],[{label:'VER MISSÕES',run:()=>{if(typeof renderMissions==='function')renderMissions()}},{label:'ENTENDI',run:()=>{}}]);return;}
  if(typeof oldInteractBuilding==='function')return oldInteractBuilding(id);
 };
 // Make guild exit always return to the village, and ensure the visible quick-exit button works.
 function leaveGuild(){try{if(typeof velkarysMapZone!=='undefined')velkarysMapZone='world';if(window.player){player.x=1396;player.y=850;}const b=$('#guildQuickExit');if(b)b.remove();document.querySelectorAll('#game .guild-interior-overlay').forEach(n=>n.remove());if(typeof saveGame==='function')saveGame(false);if(typeof drawWorld==='function')drawWorld();toast('Você saiu da Guilda e voltou à vila.')}catch(e){console.error(e)}}
 function wireGuildExit(){const b=$('#guildQuickExit');if(b)b.onclick=leaveGuild;const e=$('#guildExit');if(e)e.onclick=leaveGuild;}
 const oldGuild=window.renderGuildInterior;
 if(typeof oldGuild==='function')window.renderGuildInterior=function(){oldGuild();wireGuildExit();setTimeout(wireGuildExit,0)};
 const oldDraw=window.drawWorld;if(typeof oldDraw==='function')window.drawWorld=function(){oldDraw();wireGuildExit()};
 // Inventory is protected: only correct the existing VOLTAR button's action, no layout/data changes.
 // Inventory back action is defined directly in renderInventory; no wrapper needed.
 // Selling is only possible through the shop; keep inventory dimensions/data/layout unchanged.
 document.addEventListener('click',ev=>{const b=ev.target?.closest?.('#sellItem');if(b){ev.preventDefault();ev.stopImmediatePropagation();toast('Para vender materiais, fale com Tomas na loja.');}},true);
 // Ensure the existing interact button calls the real interaction handler; E key remains supported.
 // Interact has one authoritative click handler above; duplicate capture listener removed.

})();
</script>

<script id="velkarys-v114-interaction-fix">
(()=>{
 const game=document.getElementById('game');
 const getPlayer=()=>window.player||null;
 const getScreen=()=>typeof window.velkarysGetScreen==='function'?window.velkarysGetScreen():'game';
 function dialog(name,message,buttons=[]){
  game.querySelectorAll('.v114-dialogue').forEach(n=>n.remove());
  const ov=document.createElement('div');ov.className='v114-dialogue';
  ov.innerHTML='<div class="v114-dialogue-card" role="dialog"><button class="v114-dialogue-close goldbtn" aria-label="Fechar">×</button><h3></h3><p></p><div class="v114-actions"></div></div>';
  ov.querySelector('h3').textContent=name;ov.querySelector('p').textContent=message;
  const actions=ov.querySelector('.v114-actions');
  (buttons.length?buttons:[{label:'CONTINUAR',run:()=>{}}]).forEach(item=>{const b=document.createElement('button');b.className='goldbtn';b.textContent=item.label;b.onclick=()=>{ov.remove();if(item.run)item.run()};actions.appendChild(b)});
  ov.querySelector('.v114-dialogue-close').onclick=()=>ov.remove();game.appendChild(ov);return ov;
 }
 const targets=[
  {id:'mayor',x:1568,y:835,name:'Prefeito Aldren',msg:'Bem-vindo a Velkarys! A Guilda dos Aventureiros registra aventureiros e oferece contratos.'},
  {id:'quest',x:2280,y:900,name:'Lia · Caçadas',msg:'Posso registrar uma missão para você. Volte aqui para acompanhar suas caçadas.'},
  {id:'guild',x:1396,y:822,name:'Guilda dos Aventureiros',msg:'Entre para registrar seu rank e falar com Kael.'},
  {id:'smith',x:1501,y:819,name:'Borin · Ferreiro',msg:'Posso avaliar seu equipamento e preparar melhorias quando trouxer materiais.'},
  {id:'inn',x:1684,y:821,name:'Mira · Hospedaria',msg:'Descanse aqui para recuperar suas forças e salvar seu progresso.'},
  {id:'shop',x:1396,y:1034,name:'Tomas · Mercador',msg:'Posso comprar materiais que você não precisa mais.'},
  {id:'healer',x:1684,y:1034,name:'Nara · Curandeira',msg:'Tenho poções para ajudar você durante a aventura.'}
 ];
 function enterGuild(){if(typeof window.renderGuildInterior==='function')window.renderGuildInterior();else dialog('Guilda','A entrada da guilda está indisponível neste momento.');}
 function talkTarget(t){
  if(t.id==='guild'){dialog(t.name,t.msg,[{label:'ENTRAR',run:enterGuild},{label:'AGORA NÃO'}]);return}
  if(t.id==='quest'){dialog(t.name,t.msg,[{label:'VER MISSÕES',run:()=>{if(typeof window.renderMissions==='function')window.renderMissions()}},{label:'ACEITAR PRIMEIRA CAÇADA',run:()=>{try{const q=JSON.parse(localStorage.getItem('velkarys_quests')||'{"accepted":[],"completed":[]}');if(!q.accepted.includes('slime_intro')&&!q.completed.includes('slime_intro'))q.accepted.push('slime_intro');localStorage.setItem('velkarys_quests',JSON.stringify(q));}catch(e){}if(window.showToast)window.showToast('Missão registrada. Confira a tela Missões.')}}]);return}
  if(t.id==='inn'){dialog(t.name,t.msg,[{label:'DESCANSAR',run:()=>{const p=getPlayer();if(p){p.hp=Number(p.maxHp||p.hp);p.mp=Number(p.maxMp||p.mp);if(window.updateHud)window.updateHud();if(window.saveGame)window.saveGame(false)}if(window.showToast)window.showToast('Você descansou.')}},{label:'SAIR'}]);return}
  if(t.id==='healer'){dialog(t.name,t.msg,[{label:'COMO POSSO ME CURAR?',run:()=>dialog('Nara · Curandeira','Abra a loja de poções para escolher o item que deseja comprar.')},{label:'SAIR'}]);return}
  dialog(t.name,t.msg,[{label:'ENTENDI'},{label:'SAIR'}]);
 }
 function interact(){
  if(getScreen()!=='game')return;
  const p=getPlayer();if(!p)return;
  // If the guild interior overlay is open, route interaction directly to Kael.
  const guildOverlay=game.querySelector('.guild-interior-overlay');
  if(guildOverlay){const kael=guildOverlay.querySelector('#talkKael');if(kael){kael.click();return}}
  const zone=window.velkarysMapZone;
  if(zone==='guild'){
   const dKael=Math.hypot((Number(p.x)||0)-400,(Number(p.y)||0)-155);
   const dDoor=Math.hypot((Number(p.x)||0)-400,(Number(p.y)||0)-300);
   if(dDoor<150){window.velkarysMapZone='world';p.x=1396;p.y=850;game.querySelector('#guildQuickExit')?.remove();if(window.drawWorld)window.drawWorld();dialog('Guilda','Você saiu da Guilda dos Aventureiros.');return}
   if(dKael<190){dialog('Kael · Recepcionista','Bem-vindo à Guilda! Registre-se no rank E para começar.',[{label:'REGISTRAR · RANK E',run:()=>{localStorage.setItem('velkarys_guild',JSON.stringify({registered:true,points:0,rank:'E'}));dialog('Kael','Registro concluído. Você começou no rank E.')}},{label:'ACEITAR CONTRATO · PATRULHA',run:()=>{let j={accepted:[],completed:[],progress:{}};try{j=JSON.parse(localStorage.getItem('velkarys_jobs')||JSON.stringify(j))}catch(e){}if(!j.accepted.includes('job_patrol'))j.accepted.push('job_patrol');localStorage.setItem('velkarys_jobs',JSON.stringify(j));dialog('Kael','Contrato aceito: Patrulha da trilha.')}},{label:'FECHAR'}]);return}
   dialog('Guilda','Aproxime-se de Kael no balcão ou da porta de saída.');return;
  }
  const nearest=targets.map(t=>({...t,d:Math.hypot((Number(p.x)||0)-t.x,(Number(p.y)||0)-t.y)})).sort((a,b)=>a.d-b.d)[0];
  if(nearest&&nearest.d<420){talkTarget(nearest);return}
  dialog('Interagir','Aproxime-se do NPC ou da entrada de uma construção e toque em INTERAGIR.');
 }
 // Intercept every tap before stale handlers can cancel or override the action.
 function realInteract(){
  try{
   const nxt=game.querySelector('.dialogue-overlay #dialogueNext');if(nxt){nxt.click();return}
   const ch=game.querySelectorAll('.dialogue-overlay .goldbtn');if(ch.length===1){ch[0].click();return}
   if(game.querySelector('.dialogue-overlay')||game.querySelector('.v114-dialogue'))return;
   if(typeof window.interactNearby==='function')window.interactNearby();else interact();
  }catch(err){console.error('VELKARYS interação:',err);try{interact()}catch(e2){}}
 }
 let lastTap=0;const fire=e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const t=Date.now();if(t-lastTap<350)return;lastTap=t;realInteract()};
 const btn=document.getElementById('interactBtn');
 if(btn){btn.addEventListener('click',fire,true);btn.addEventListener('pointerup',e=>{if(e.pointerType==='touch')fire(e)},true);btn.style.pointerEvents='auto';btn.style.touchAction='manipulation';}
 // Kael button in the interior must not invoke the broken legacy dialogue renderer.
 game.addEventListener('click',e=>{const b=e.target.closest('#talkKael');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();const st=(()=>{try{return JSON.parse(localStorage.getItem('velkarys_guild')||'{"registered":false,"points":0}')}catch(_){return {registered:false,points:0}}})();if(!st.registered){dialog('Kael · Recepcionista','Para aceitar contratos, primeiro registre-se. Seu rank inicial será E.',[{label:'REGISTRAR · RANK E',run:()=>{localStorage.setItem('velkarys_guild',JSON.stringify({registered:true,points:0,rank:'E'}));if(window.showToast)window.showToast('Registro concluído: rank E.')}} ,{label:'AINDA NÃO'}]);}else{dialog('Kael · Recepcionista','Seu registro está ativo no rank '+(st.rank||'E')+'. Escolha um contrato.',[{label:'ACEITAR · PATRULHA',run:()=>{let j={accepted:[],completed:[],progress:{}};try{j=JSON.parse(localStorage.getItem('velkarys_jobs')||JSON.stringify(j))}catch(_){}if(!j.accepted.includes('job_patrol'))j.accepted.push('job_patrol');localStorage.setItem('velkarys_jobs',JSON.stringify(j));dialog('Kael','Contrato aceito: Patrulha da trilha.')}},{label:'ACEITAR · ERVAS',run:()=>{let j={accepted:[],completed:[],progress:{}};try{j=JSON.parse(localStorage.getItem('velkarys_jobs')||JSON.stringify(j))}catch(_){}if(!j.accepted.includes('job_herbs'))j.accepted.push('job_herbs');localStorage.setItem('velkarys_jobs',JSON.stringify(j));dialog('Kael','Contrato aceito: Entrega de ervas.')}},{label:'FECHAR'}]);}},true);
 // Inventory BACK means return to the adventurer menu, never close everything.
 game.addEventListener('click',e=>{const b=e.target.closest('.inventory-window .back-button');if(!b)return;e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();game.querySelectorAll('.modal').forEach(n=>n.remove());if(typeof window.renderAdventure==='function')window.renderAdventure();else if(typeof window.openAdventure==='function')window.openAdventure();},true);
})();
</script>


<script id="velkarys-interaction-repair">
/* Final hotfix: route the touch control to the game's real interaction function. */
(function(){
  function bindInteraction(){
    const btn=document.getElementById('interactBtn');
    if(!btn) return;
    btn.style.pointerEvents='auto'; btn.style.touchAction='manipulation'; btn.style.position='relative'; btn.style.zIndex='10050';
    const run=function(ev){
      if(ev){ev.preventDefault();ev.stopPropagation();}
      try {
        if(typeof window.interactNearby==='function'){ window.interactNearby(); return; }
        const gameScript=document.querySelector('script');
        const toast=document.getElementById('toast');
        if(toast){toast.textContent='Interação ainda carregando. Toque novamente.';toast.classList.remove('hidden');}
      } catch(err) {
        console.error('VELKARYS interação:',err);
        const toast=document.getElementById('toast');
        if(toast){toast.textContent='Falha na interação. Recarregue o jogo.';toast.classList.remove('hidden');}
      }
    };
    btn.onclick=run;
    btn.addEventListener('pointerup',function(ev){if(ev.pointerType==='touch'){ev.preventDefault();run(ev);}},{passive:false});
  }
  bindInteraction();
  document.addEventListener('DOMContentLoaded',bindInteraction,{once:true});
  window.addEventListener('keydown',function(ev){if(ev.key&&ev.key.toLowerCase()==='e'&&typeof window.interactNearby==='function'){ev.preventDefault();window.interactNearby();}},true);
})();
</script>

<script id="velkarys-hotfix-1027-shops">
(()=>{'use strict';
 const game=document.getElementById('game');
 const toast=m=>{try{window.showToast(m)}catch(e){}};
 const T=[{id:'mayor',x:1568,y:835},{id:'quest',x:2280,y:900},{id:'guild',x:1396,y:822},{id:'smith',x:1501,y:819},{id:'inn',x:1684,y:821},{id:'shop',x:1396,y:1034},{id:'healer',x:1684,y:1034}];
 const extras={get(){try{return JSON.parse(localStorage.getItem('velkarys_shop_extras')||'{}')}catch(e){return {}}},set(v){try{localStorage.setItem('velkarys_shop_extras',JSON.stringify(v))}catch(e){}}};
 const GEAR=[
  ['elmo_ferro','Elmo de Ferro','DEF +2',10,'Cabeça'],['armadura_ferro','Armadura de Ferro','HP +3 · DEF +2 · MDEF +1',18,'Peitoral'],['calcas_couro','Calças de Couro','HP +2 · DEF +1 · EVA +1',9,'Pernas'],['botas_couro','Botas de Couro','DEF +1 · EVA +1',8,'Pés'],
  ['espada_ferro','Espada de Ferro','ATK +2',15,'Arma'],['escudo_madeira','Escudo de Madeira','DEF +2',10,'Escudo'],['anel_ferro','Anel de Ferro','ATK +1',5,'Acessório'],['pingente_safira','Pingente de Safira','MP +3 · MATK +1',12,'Acessório']
 ].map(([id,name,bonus,price,slot])=>({id,name,bonus,price,slot,img:'assets/items/shop/'+id+'.png'}));
 const HP={id:'pocao_hp',name:'Poção de HP',bonus:'Recupera 15 HP',price:3,img:'assets/items/shop/pocao_hp.png',type:'hp'};
 const coins=()=>Math.max(0,Number(window.player&&window.player.gold)||0);
 const esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 function openShop(kind){
  game.querySelectorAll('.modal').forEach(n=>n.remove());
  const ov=document.createElement('div');ov.className='overlay modal vk-shop';game.appendChild(ov);
  const items=kind==='smith'?GEAR:[HP];
  const paint=()=>{
   const owned=(extras.get().equipment)||[];
   ov.innerHTML=`<div class="vk-shop-win ${kind}" role="dialog"><div class="vk-shop-head"><h2>${kind==='smith'?'FERREIRO · BORIN':'CURANDEIRA · NARA'}</h2><span class="vk-coins">🪙 <b>${coins()}</b></span><button type="button" class="vk-x" aria-label="Fechar">✕</button></div><div class="vk-shop-grid">${items.map(i=>{const has=owned.includes(i.id);return `<article class="vk-card"><div class="vk-img"><img src="${i.img}" alt="${esc(i.name)}"></div><strong>${esc(i.name)}</strong><small>${esc(i.bonus)}</small><button type="button" class="vk-buy" data-id="${i.id}" ${has?'disabled':''} ${!has&&coins()<i.price?'data-poor':''}>${has?'COMPRADO ✓':'🪙 '+i.price}</button></article>`}).join('')}</div></div>`;
   ov.querySelector('.vk-x').onclick=()=>ov.remove();
   ov.onclick=e=>{if(e.target===ov)ov.remove()};
   ov.querySelectorAll('.vk-buy').forEach(b=>b.onclick=()=>{
    const it=items.find(x=>x.id===b.dataset.id);if(!it||!window.player)return;
    if(coins()<it.price){toast('Moedas insuficientes para '+it.name+'.');return}
    const ex=extras.get();window.player.gold=coins()-it.price;
    if(it.type==='hp'){ex.hpPotions=(Number(ex.hpPotions)||0)+1;window.player.hpPotions=ex.hpPotions}
    else{ex.equipment=Array.isArray(ex.equipment)?ex.equipment:[];ex.equipment.push(it.id);const pl=window.player;pl.purchasedEquipment=Array.isArray(pl.purchasedEquipment)?pl.purchasedEquipment:[];pl.purchasedEquipment.push({id:it.id,name:it.name,slot:it.slot,bonus:it.bonus,price:it.price,img:it.img,level:1,rarity:'Comum'})}
    extras.set(ex);try{window.saveGame(false)}catch(e){}try{window.updateHud()}catch(e){}
    toast('Compra concluída: '+it.name+'.');paint();
   });
  };paint();
 }
 function openSell(){
  game.querySelectorAll('.modal').forEach(n=>n.remove());
  const ov=document.createElement('div');ov.className='overlay modal vk-shop';game.appendChild(ov);
  const gel=()=>Math.max(0,Number(window.player&&window.player.gel)||0);
  const paint=()=>{
   ov.innerHTML=`<div class="vk-shop-win healer" role="dialog"><div class="vk-shop-head"><h2>LOJA · MATERIAIS</h2><span class="vk-coins">🪙 <b>${coins()}</b></span><button type="button" class="vk-x" aria-label="Fechar">✕</button></div><div class="vk-shop-grid"><article class="vk-card"><div class="vk-img"><img src="assets/monsters/slime_water_icon.png" alt="Gelatina Brilhante"></div><strong>Gelatina Brilhante</strong><small>Material comum · você tem ${gel()}</small><div style="display:flex;gap:6px;width:100%"><button type="button" class="vk-buy" id="vkSell1" ${gel()<1?'disabled':''}>VENDER 1 · 🪙2</button><button type="button" class="vk-buy" id="vkSellAll" ${gel()<1?'disabled':''}>TUDO</button></div></article></div></div>`;
   ov.querySelector('.vk-x').onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};
   const sell=n=>{const q=Math.min(gel(),n);if(q<1){toast('Você não tem Gelatina Brilhante para vender.');return}window.player.gel=gel()-q;window.player.gold=coins()+q*2;try{window.saveGame(false)}catch(e){}try{window.updateHud()}catch(e){}toast(q+' Gelatina(s) vendida(s) por '+q*2+' moedas.');paint()};
   ov.querySelector('#vkSell1').onclick=()=>sell(1);ov.querySelector('#vkSellAll').onclick=()=>sell(gel());
  };paint();
 }
 window.vkTalk=function(kind){
  if(kind==='smith')return window.showDialogue('Borin · Ferreiro',['Equipamentos comuns de nível 1 para sua jornada começar bem.'],[{label:'VER EQUIPAMENTOS',run:()=>openShop('smith')},{label:'FECHAR',run:()=>{}}]);
  if(kind==='healer')return window.showDialogue('Nara · Curandeira',['Só trabalho com poções de HP. Simples e eficientes.'],[{label:'VER POÇÃO DE HP',run:()=>openShop('healer')},{label:'FECHAR',run:()=>{}}]);
  if(kind==='shop')return window.showDialogue('Tomas · Mercador',['Aqui eu só compro materiais. Traga o que coletar nas caçadas.'],[{label:'VENDER MATERIAIS',run:openSell},{label:'FECHAR',run:()=>{}}]);
 };
 const prevB=window.interactBuilding;
 window.interactBuilding=function(id){
  if((id==='smith'||id==='healer'||id==='shop')&&typeof window.vkEnter==='function'){window.vkEnter(id);return}
  return prevB&&prevB.apply(this,arguments);
 };
 const prevN=window.interactNearby;
 window.interactNearby=function(){
  if(window.velkarysGetScreen&&window.velkarysGetScreen()!=='game')return;
  if(window.velkarysMapZone==='guild'&&window.player&&typeof window.vkKael==='function'){const dd=Math.hypot(window.player.x-400,window.player.y-300),kd=Math.hypot(window.player.x-400,window.player.y-155);if(kd<145&&kd<=dd){window.vkKael();return}}
  if(window.velkarysMapZone==='world'&&window.player){
   const n=T.map(t=>({...t,d:Math.hypot(window.player.x-t.x,window.player.y-t.y)})).sort((a,b)=>a.d-b.d)[0];
   if(n&&n.d<260){window.interactBuilding(n.id);return}
  }
  return prevN&&prevN.apply(this,arguments);
 };
})();
</script>

.vk-bhead{display:flex;align-items:center;gap:8px}
.vk-bhead h2{margin:0;font-size:clamp(12px,3.4vh,18px);color:#f2d38d;letter-spacing:.05em;white-space:nowrap}
.vk-bprog{flex:1;font-size:clamp(9px,2.4vh,12px);color:#b9d9ea;line-height:1.2}
.vk-bprog b{color:#ffe08a}
.vk-bar{height:6px;border-radius:4px;background:#0006;margin-top:2px;overflow:hidden}.vk-bar i{display:block;height:100%;background:linear-gradient(90deg,#f0c565,#e08a1e)}
.vk-btabs{display:flex;gap:5px}
.vk-btab{flex:1;padding:4px 0;border:1px solid #4b6f86;border-radius:8px;background:#12304a;color:#dcecf5;font-weight:800;font-size:clamp(11px,3vh,15px);cursor:pointer;touch-action:manipulation}
.vk-btab.on{border-color:#f0c565;background:linear-gradient(#f0c565,#b8861f);color:#2a1a00}
.vk-btab.lock{opacity:.7}
.vk-blist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.vk-ct{display:flex;flex-direction:column;gap:4px;padding:6px 7px;border:1px solid #4b6f86;border-radius:11px;background:linear-gradient(160deg,#1a3b54,#0b2033);min-width:0;position:relative}
.vk-ct.soon{opacity:.82}
.vk-ct-head{display:flex;align-items:center;gap:6px;min-width:0}
.vk-ct-head strong{flex:1;font-size:clamp(10px,2.9vh,14px);line-height:1.1;color:#fff;min-width:0}
.vk-rk{flex:0 0 auto;display:grid;place-items:center;width:22px;height:22px;border-radius:6px;font-weight:900;font-size:13px;color:#10151c}
.vk-rk.E{background:#9fd3a8}.vk-rk.D{background:#7fb8ff}.vk-rk.C{background:#c59bff}.vk-rk.B{background:#ffb35c}.vk-rk.A{background:#ff7a7a}.vk-rk.S{background:#ffd54a}
.vk-tag{flex:0 0 auto;font-size:clamp(8px,2.1vh,10px);padding:2px 6px;border-radius:999px;background:#0007;border:1px solid #c9a65e;color:#ffe08a;white-space:nowrap}
.vk-ct-body{display:flex;gap:7px;min-width:0}
.vk-ico{flex:0 0 auto;display:flex;gap:4px}
.vk-ico figure{margin:0;width:clamp(34px,10vh,48px);display:flex;flex-direction:column;align-items:center;gap:1px}
.vk-ico figure>img,.vk-ico figure>.vk-emo{width:clamp(26px,8vh,38px);height:clamp(26px,8vh,38px);object-fit:contain;image-rendering:pixelated;background:#0006;border-radius:7px;display:grid;place-items:center;font-size:clamp(16px,5vh,24px)}
.vk-ico figcaption{font-size:clamp(7px,1.9vh,9px);line-height:1.05;text-align:center;color:#a9d0e4}
.vk-txt{min-width:0;font-size:clamp(9px,2.4vh,12px);line-height:1.2;color:#d9e9f2}
.vk-txt p{margin:0 0 2px}
.vk-txt .rw{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:#ffe08a}
.vk-txt .rw img{width:18px;height:18px;object-fit:contain;image-rendering:pixelated}
.vk-ct .vk-buy{min-height:24px;margin-top:2px}
.vk-det h3{margin:0 0 4px;color:#f2d38d}
</style>
<script id="velkarys-contracts-js">
(()=>{'use strict';
 const game=document.getElementById('game');
 const toast=m=>{try{window.showToast(m)}catch(e){}};
 const SLIME='assets/monsters/slime_water_icon.png',IMG=n=>'assets/items/shop/'+n+'.png';
 const RANKS=['E','D','C','B','A','S'];
 const C=[
  {id:'job_patrol',rank:'E',name:'Sentinela da Trilha',kind:'kill',need:2,goal:'Derrote 2 slimes',desc:'Viajantes têm medo de passar pela trilha. Afaste as gosmas para abrir caminho.',where:'Trilha e Campo de Caça, a leste da vila',monster:{name:'Slime de Água Nv.1',icon:SLIME},item:{name:'Gelatina (drop)',icon:SLIME},gold:8,xp:20},
  {id:'job_herbs',rank:'E',name:'Gosma para a Boticária',kind:'collect',need:3,goal:'Entregue 3 Gelatinas Brilhantes',desc:'A boticária usa gelatina de slime em seus unguentos. Colete e entregue.',where:'Slimes do Campo de Caça (a leste)',monster:{name:'Slime de Água Nv.1',icon:SLIME},item:{name:'Gelatina Brilhante ×3',icon:SLIME},gold:12,xp:0},
  {id:'job_clean',rank:'E',name:'Limpeza do Campo de Caça',kind:'kill',need:5,goal:'Derrote 5 slimes',desc:'O campo está tomado por slimes. Reduza a população antes que se espalhem.',where:'Campo de Caça, a leste da vila',monster:{name:'Slime de Água Nv.1',icon:SLIME},item:{name:'Gelatina (drop)',icon:SLIME},gold:25,xp:40},
  {id:'job_stock',rank:'E',name:'Estoque de Poções',kind:'collect',need:8,goal:'Entregue 8 Gelatinas Brilhantes',desc:'A curandeira Nara precisa de gelatina para repor o estoque de poções.',where:'Slimes do Campo de Caça (a leste)',monster:{name:'Slime de Água Nv.1',icon:SLIME},item:{name:'Gelatina Brilhante ×8',icon:SLIME},gold:20,xp:15,items:[{name:'Poção de HP',icon:IMG('pocao_hp'),qty:2,type:'hp'}]},
  {id:'d_wolf',rank:'D',kind:'soon',name:'Rastro do Lobo Cinzento',goal:'Derrote 6 lobos',desc:'Uma matilha ronda a estrada do norte.',where:'Floresta Sombria, ao norte',monster:{name:'Lobo Cinzento Nv.8',icon:'🐺'},item:{name:'Presa de Lobo ×5',icon:'🦷'},gold:60,xp:120,items:[{name:'Elmo de Ferro',icon:IMG('elmo_ferro'),qty:1}]},
  {id:'d_bat',rank:'D',kind:'soon',name:'Morcegos da Caverna Úmida',goal:'Derrote 8 morcegos',desc:'Morcegos assustam os mineiros na caverna.',where:'Caverna Úmida, a oeste',monster:{name:'Morcego Cavernoso Nv.10',icon:'🦇'},item:{name:'Asa Rasgada ×6',icon:'🪶'},gold:70,xp:140,items:[{name:'Botas de Couro',icon:IMG('botas_couro'),qty:1}]},
  {id:'c_golem',rank:'C',kind:'soon',name:'Guardião da Ponte Antiga',goal:'Derrote 1 golem',desc:'Um golem desperto bloqueia a ponte de pedra.',where:'Ponte Antiga, ao sul',monster:{name:'Golem de Pedra Nv.18',icon:'🗿'},item:{name:'Núcleo Rochoso',icon:'💎'},gold:150,xp:300,items:[{name:'Armadura de Ferro',icon:IMG('armadura_ferro'),qty:1}]},
  {id:'c_goblin',rank:'C',kind:'soon',name:'Ninho dos Goblins',goal:'Derrote 10 goblins',desc:'Saqueadores acampados atacam caravanas.',where:'Acampamento Goblin, a leste',monster:{name:'Goblin Saqueador Nv.20',icon:'👺'},item:{name:'Orelha de Goblin ×10',icon:'👂'},gold:180,xp:340,items:[{name:'Calças de Couro',icon:IMG('calcas_couro'),qty:1}]},
  {id:'b_troll',rank:'B',kind:'soon',name:'Troll das Pedras Vermelhas',goal:'Derrote 1 troll',desc:'Uma criatura enorme destrói as plantações.',where:'Colinas Rubras, a nordeste',monster:{name:'Troll Brutal Nv.30',icon:'🧌'},item:{name:'Couro de Troll ×3',icon:'🟫'},gold:400,xp:700,items:[{name:'Escudo de Madeira',icon:IMG('escudo_madeira'),qty:1}]},
  {id:'a_wyvern',rank:'A',kind:'soon',name:'Senhor das Cinzas',goal:'Derrote 1 wyvern',desc:'Uma wyvern incendeia as aldeias vizinhas.',where:'Montanha Cinzenta, ao norte',monster:{name:'Wyvern Ígnea Nv.45',icon:'🔥'},item:{name:'Escama de Wyvern ×4',icon:'🐲'},gold:1000,xp:1600,items:[{name:'Pingente de Safira',icon:IMG('pingente_safira'),qty:1}]},
  {id:'s_dragon',rank:'S',kind:'soon',name:'O Dragão de Velkarys',goal:'Derrote o boss final',desc:'A lenda da guilda: o Dragão Ancestral desperta.',where:'Ninho Ancestral, além das montanhas',monster:{name:'Dragão Ancestral Nv.60 (Boss)',icon:'🐉'},item:{name:'Coração de Dragão',icon:'❤️'},gold:5000,xp:8000,items:[{name:'Anel de Ferro',icon:IMG('anel_ferro'),qty:1}]}
 ];
 C.forEach(c=>{c.rewardText=c.gold+' moedas'+(c.xp?' · '+c.xp+' XP':'')+(c.items?' · '+c.items.map(i=>i.name+(i.qty>1?' ×'+i.qty:'')).join(', '):'')+' · +1 ponto de rank'});
 window.VK_CONTRACTS=C;
 const esc=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const ico=(x)=>String(x).startsWith('assets')?`<img src="${x}" alt="">`:`<span class="vk-emo">${x}</span>`;
 const jobs=()=>{try{return Object.assign({accepted:[],completed:[],progress:{}},JSON.parse(localStorage.getItem('velkarys_jobs')||'{}'))}catch(e){return {accepted:[],completed:[],progress:{}}}};
 const saveJobs=j=>{try{localStorage.setItem('velkarys_jobs',JSON.stringify(j))}catch(e){}};
 const guild=()=>{try{return Object.assign({registered:false,points:0},JSON.parse(localStorage.getItem('velkarys_guild')||'{}'))}catch(e){return {registered:false,points:0}}};
 const rankIdx=g=>g.registered?Math.min(5,Math.floor((g.points||0)/3)):-1;
 const find=id=>C.find(c=>c.id===id);
 window.vkProgress=id=>{const c=find(id);if(!c)return 0;if(c.kind==='collect')return Math.min(c.need,Math.max(0,Number(window.player&&window.player.gel)||0));return Math.min(c.need,Number(jobs().progress[id])||0)};
 window.vkJobsForMenu=()=>C.filter(c=>c.kind!=='soon').map(c=>({id:c.id,title:c.name,desc:c.desc,goal:c.goal,need:c.need,reward:c.rewardText}));
 const body=(c)=>`<div class="vk-ct-body"><div class="vk-ico"><figure>${ico(c.monster.icon)}<figcaption>${esc(c.monster.name)}</figcaption></figure><figure>${ico(c.item.icon)}<figcaption>${esc(c.item.name)}</figcaption></figure></div><div class="vk-txt"><p>${esc(c.goal)}</p><p>📍 ${esc(c.where)}</p><p class="rw">🎁 ${c.gold}🪙${c.xp?' · '+c.xp+' XP':''}${(c.items||[]).map(i=>`<img src="${i.icon}" alt="" title="${esc(i.name)}">${esc(i.name)}${i.qty>1?' ×'+i.qty:''}`).join('')}</p></div></div>`;
 window.vkDetailHtml=id=>{const c=find(id);if(!c)return '';const j=jobs(),p=window.vkProgress(id),done=j.completed.includes(id);
  return `<div class="vk-det"><h3><span class="vk-rk ${c.rank}" style="display:inline-grid;vertical-align:middle">${c.rank}</span> ${esc(c.name)}</h3><p>${esc(c.desc)}</p>${body(c)}<p><b>Progresso:</b> ${done?'Concluído':p+' / '+c.need}</p>${!done&&p>=c.need?'<button class="goldbtn" id="finishJob">CONCLUIR E RECEBER</button>':''}</div>`};
 window.vkFinish=id=>{
  const c=find(id),j=jobs();if(!c||j.completed.includes(id)||!j.accepted.includes(id))return;
  if(window.vkProgress(id)<c.need){toast('Objetivo ainda não concluído.');return}
  const pl=window.player;if(c.kind==='collect')pl.gel=Math.max(0,(Number(pl.gel)||0)-c.need);
  pl.gold=(Number(pl.gold)||0)+c.gold;
  if(c.items){let ex={};try{ex=JSON.parse(localStorage.getItem('velkarys_shop_extras')||'{}')}catch(e){}for(const it of c.items){if(it.type==='hp'){ex.hpPotions=(Number(ex.hpPotions)||0)+it.qty;pl.hpPotions=ex.hpPotions}}try{localStorage.setItem('velkarys_shop_extras',JSON.stringify(ex))}catch(e){}}
  j.accepted=j.accepted.filter(x=>x!==id);j.completed.push(id);saveJobs(j);
  const g=guild(),before=rankIdx(g);g.points=(g.points||0)+1;try{localStorage.setItem('velkarys_guild',JSON.stringify(g))}catch(e){}
  if(c.xp&&typeof window.gainXP==='function')window.gainXP(c.xp);
  try{window.saveGame(false)}catch(e){}try{window.updateHud()}catch(e){}
  const after=rankIdx(g);toast(after>before?'Contrato concluído! Rank subiu para '+RANKS[after]+'!':'Contrato concluído: '+c.name+'. +1 ponto de rank.');
 };
 function openBoard(startTab){
  game.querySelectorAll('.modal').forEach(n=>n.remove());
  const ov=document.createElement('div');ov.className='overlay modal vk-board';game.appendChild(ov);
  let tab=startTab||'E';
  const paint=()=>{
   const g=guild(),ri=rankIdx(g),j=jobs();
   const cur=ri<0?'—':RANKS[ri],into=(g.points||0)%3,next=ri>=5?null:RANKS[ri+1];
   const list=C.filter(c=>c.rank===tab);
   ov.innerHTML=`<div class="vk-bwin" role="dialog"><div class="vk-bhead"><h2>QUADRO DE CONTRATOS</h2><div class="vk-bprog">Seu rank: <b>${cur}</b>${next?` · ${into}/3 contratos para o rank <b>${next}</b>`:' · rank máximo!'}<div class="vk-bar"><i style="width:${ri>=5?100:into/3*100}%"></i></div></div><button type="button" class="vk-x" aria-label="Fechar">✕</button></div><div class="vk-btabs">${RANKS.map((r,i)=>`<button type="button" class="vk-btab ${r===tab?'on':''} ${i>ri?'lock':''}" data-t="${r}">${i>ri?'🔒 ':''}${r}</button>`).join('')}</div><div class="vk-blist">${list.map(c=>{
    const done=j.completed.includes(c.id),acc=j.accepted.includes(c.id),p=window.vkProgress(c.id),lock=RANKS.indexOf(c.rank)>ri;
    let tag='',btn='';
    if(c.kind==='soon'){tag='EM BREVE';btn='<button type="button" class="vk-buy" disabled>REGIÃO AINDA NÃO EXPLORÁVEL</button>'}
    else if(done){tag='CONCLUÍDO ✓';btn='<button type="button" class="vk-buy" disabled>CONCLUÍDO ✓</button>'}
    else if(acc){tag=p+'/'+c.need;btn=p>=c.need?`<button type="button" class="vk-buy" data-fin="${c.id}">CONCLUIR E RECEBER</button>`:`<button type="button" class="vk-buy" disabled>EM ANDAMENTO · ${p}/${c.need}</button>`}
    else if(lock){tag='RANK '+c.rank;btn=`<button type="button" class="vk-buy" disabled>RANK ${c.rank} NECESSÁRIO</button>`}
    else btn=`<button type="button" class="vk-buy" data-acc="${c.id}">ACEITAR CONTRATO</button>`;
    return `<article class="vk-ct ${c.kind==='soon'?'soon':''}"><div class="vk-ct-head"><span class="vk-rk ${c.rank}">${c.rank}</span><strong>${esc(c.name)}</strong>${tag?`<span class="vk-tag">${tag}</span>`:''}</div>${body(c)}${btn}</article>`}).join('')}</div></div>`;
   ov.querySelector('.vk-x').onclick=()=>ov.remove();ov.onclick=e=>{if(e.target===ov)ov.remove()};
   ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;paint()});
   ov.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{const jj=jobs(),id=b.dataset.acc;if(!jj.accepted.includes(id)&&!jj.completed.includes(id))jj.accepted.push(id);saveJobs(jj);toast('Contrato aceito: '+find(id).name+'.');paint()});
   ov.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>{window.vkFinish(b.dataset.fin);paint()});
  };paint();
 }
 window.vkOpenBoard=openBoard;
 window.vkKael=function(){
  const g=guild();
  if(!g.registered)return window.showDialogue('Kael · Recepcionista',['Bem-vindo à Guilda dos Aventureiros. Registre-se para pegar contratos. Você começa no rank E e pode chegar ao rank S.'],[{label:'REGISTRAR · RANK E',run:()=>{try{localStorage.setItem('velkarys_guild',JSON.stringify({registered:true,points:0,rank:'E'}))}catch(e){}try{window.saveGame(false)}catch(e){}toast('Registro concluído: rank E.')}},{label:'AGORA NÃO',run:()=>{}}]);
  const ri=rankIdx(g);
  return window.showDialogue('Kael · Recepcionista',['Seu rank é '+RANKS[ri]+'. A cada 3 contratos concluídos você sobe um rank, de E até S. Confira o quadro: cada contrato mostra o monstro, o item, o local e a recompensa.'],[{label:'VER CONTRATOS',run:()=>openBoard(RANKS[Math.max(0,ri)])},{label:'FECHAR',run:()=>{}}]);
 };
})();
</script>
